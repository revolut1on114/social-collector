# docker compose run --rm collector                       — один інкрементний прогін
# docker compose run --rm collector python -m collector homework --min 200
# docker compose --profile loop up -d                     — збір кожні LOOP_INTERVAL_S
# docker compose --profile dashboard up -d                — http://localhost:8080/dashboard.html

x-common: &common
  build: .
  image: social-collector:latest
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/app/data

services:
  collector:
    <<: *common
    command: ["python", "-m", "collector", "run"]

  collector-loop:
    <<: *common
    profiles: ["loop"]
    restart: unless-stopped
    command: ["python", "-m", "collector", "loop"]

  dashboard:
    image: python:3.12-slim
    profiles: ["dashboard"]
    working_dir: /srv
    volumes:
      - ./data/export:/srv:ro
    ports:
      - "8080:8080"
    command: ["python", "-m", "http.server", "8080"]
